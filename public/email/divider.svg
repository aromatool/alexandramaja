<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" width="320" height="40">
  <g fill="none" stroke-linecap="round">
    <!-- stems: sage, mirrored from center -->
    <g stroke="#aba286" stroke-width="1.3">
      <path d="M160 24 C 198 23 236 26 286 22" />
      <path d="M160 24 C 122 23 84 26 34 22" />
    </g>
    <!-- leaves: lavender teardrops, mirrored -->
    <g fill="#9a7a84" fill-opacity="0.28" stroke="#9a7a84" stroke-width="1.1">
      <!-- right side -->
      <path d="M190 23.4 c 1 -3.4 4 -5.4 8 -5.6 -1.4 3.2 -4.2 5.2 -8 5.6 Z" />
      <path d="M212 24.4 c 1.2 3 4.4 4.6 8.4 4.4 -1.8 -2.8 -4.8 -4.4 -8.4 -4.4 Z" />
      <path d="M236 24.6 c 1 -3.4 4 -5.4 8 -5.6 -1.4 3.2 -4.2 5.2 -8 5.6 Z" />
      <path d="M258 23.6 c 1.2 2.8 4.2 4.4 8 4.2 -1.6 -2.6 -4.6 -4.2 -8 -4.2 Z" />
      <!-- left side (mirror) -->
      <path d="M130 23.4 c -1 -3.4 -4 -5.4 -8 -5.6 1.4 3.2 4.2 5.2 8 5.6 Z" />
      <path d="M108 24.4 c -1.2 3 -4.4 4.6 -8.4 4.4 1.8 -2.8 4.8 -4.4 8.4 -4.4 Z" />
      <path d="M84 24.6 c -1 -3.4 -4 -5.4 -8 -5.6 1.4 3.2 4.2 5.2 8 5.6 Z" />
      <path d="M62 23.6 c -1.2 2.8 -4.2 4.4 -8 4.2 1.6 -2.6 4.6 -4.2 8 -4.2 Z" />
    </g>
    <!-- center upright sprig (favicon nod) -->
    <g stroke="#9a7a84" stroke-width="1.3">
      <path d="M160 26 V 12" />
    </g>
    <path d="M160 15 c 0 -3 1.6 -5.2 4 -6.2 -0.2 2.9 -1.6 5.1 -4 6.2 Z" fill="#9a7a84" fill-opacity="0.35" stroke="#9a7a84" stroke-width="1.1" />
    <path d="M160 17 c 0 -3 -1.6 -5.2 -4 -6.2 0.2 2.9 1.6 5.1 4 6.2 Z" fill="#9a7a84" fill-opacity="0.35" stroke="#9a7a84" stroke-width="1.1" />
    <!-- little terracotta berry at the crown -->
    <circle cx="160" cy="8.5" r="2.2" fill="#c79b77" stroke="none" />
  </g>
</svg>
