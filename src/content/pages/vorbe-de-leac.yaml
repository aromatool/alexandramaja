description: >-
  nvitata mea este dr. Debora Marias, medic specialist neurologie. Vom vorbi
  despre ceața mentală, problemele de memorie, migrene, stres, somn și acele
  semne pe care nu ar trebui să le ignorăm. Vom afla și ce putem face, prin
  obiceiuri mici și realiste, pentru a reduce riscul bolilor precum Alzheimer,
  Parkinson sau demență.


  Noi punem întrebările, medicul ne răspunde, iar conversația continuă firesc,
  la un pahar de prosecco, cu aperitive și ceva dulce.
