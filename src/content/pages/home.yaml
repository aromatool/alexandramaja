aboutTitle: Despre mine
aboutText: >-
  Sunt pasionată de plante, de aromaterapie și de modul în care natura ne poate
  susține fiecare pas. Călătoresc, învăț, experimentez și împărtășesc aici tot
  ce descopăr și trăiesc.
