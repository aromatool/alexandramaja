heroTitleLine1: Natură. Echilibru.
heroTitleAccent: Viață cu sens.
heroSub: >-
  Inspirație din plante, aromaterapie și alegeri conștiente pentru o viață mai
  simplă, mai sănătoasă și mai frumoasă.
heroCta: Intră în bibliotecă
heroQuote: Când ne întoarcem la simplitate, ne întoarcem la noi înșine.
