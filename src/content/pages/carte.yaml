coverAlt: Coperta cărții „Dezvoltare de la gura sobei”
pitch: >-
  "Dezvoltare personală de la gura sobei” este o călătorie prin copilăria,
  adolescența și o parte din viața mea de adult, spusă nu pentru a-ți arăta cum
  să trăiești, ci pentru a te invita să privești, prin lentila experiențelor
  mele, ce înseamnă cu adevărat succesul. Am adunat aici întâmplări, oameni,
  alegeri și lecții care m-au format și care mi-au schimbat, de-a lungul anilor,
  felul în care privesc viața. Poate că povestea mea nu seamănă deloc cu a ta.
  Dar poate, printre paginile ei, vei găsi o întrebare, un gând sau o bucată de
  curaj care să te ajute să-ți privești propria poveste cu alți ochi.
